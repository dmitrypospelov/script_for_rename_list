<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: Arial, sans-serif; padding: 25px; background: #f8f9fa; margin: 0; }
  h3 { margin-top: 0; color: #333; text-align: center; font-size: 16px; }
  select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; background: white; margin-top: 20px; }
  button { padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
  .btn-yes { background: #458275; color: #F0EBE2; width: 100%; margin-top: 20px; padding: 12px; }
  .btn-yes:hover { background: #36695e; }
  .btn-no { background: #e0e0e0; color: #333; width: 100%; margin-top: 8px; padding: 12px; }
  .btn-no:hover { background: #d0d0d0; }
  .save-btn { display: block; margin: 0 auto; background: #458275; color: #F0EBE2; padding: 12px 30px; }
  .save-btn:hover { background: #36695e; }
  .icon { font-size: 48px; margin-bottom: 15px; display: inline-block; filter: hue-rotate(120deg) saturate(1.2); }
  .center { text-align: center; padding: 30px 0; }
  .hint { font-size: 11px; color: #888; text-align: center; margin-bottom: 15px; line-height: 1.4; }
  .sum-input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; box-sizing: border-box; margin-bottom: 8px; }
  .error { font-size: 11px; color: #c62828; text-align: center; margin-bottom: 12px; display: none; line-height: 1.4; }
</style>
</head>
<body>
<div id="content"></div>

<script>
function showMonthStep() {
  document.getElementById('content').innerHTML =
    '<h3>С какого месяца Вы планируете начать вести бюджет?</h3>' +
    '<select id="month">' +
    '<option value="">Выбрать месяц</option>' +
    '<option>Январь</option><option>Февраль</option><option>Март</option>' +
    '<option>Апрель</option><option>Май</option><option>Июнь</option>' +
    '<option>Июль</option><option>Август</option><option>Сентябрь</option>' +
    '<option>Октябрь</option><option>Ноябрь</option><option>Декабрь</option>' +
    '</select>' +
    '<div class="error" id="errorMonth">Пожалуйста, выберите месяц из списка</div>' +
    '<button class="btn-yes" onclick="saveMonth()">Далее</button>';
}

function saveMonth() {
  var month = document.getElementById('month').value;
  var error = document.getElementById('errorMonth');
  if (!month) { error.style.display = 'block'; return; }
  error.style.display = 'none';
  showWaiting();
  google.script.run
    .withSuccessHandler(function(res) { showSumStep(res); })
    .withFailureHandler(function(err) { showSumStep('Ошибка: ' + err.message); })
    .saveMonth(month);
}

function showWaiting() {
  document.getElementById('content').innerHTML =
    '<div class="center">' +
    '<div class="icon">❤️</div>' +
    '<div style="font-size:16px;color:#333;font-weight:bold;margin-bottom:8px;">Подождите, пожалуйста,</div>' +
    '<div style="font-size:14px;color:#666;">готовим таблицу для Вас!</div>' +
    '</div>';
}

function showSumStep(info) {
  document.getElementById('content').innerHTML =
    '<h3>Хотите ли указать Начальную сумму?</h3>' +
    '<div class="hint">Начальная сумма — сумма всех текущих наличных и безналичных денег</div>' +
    '<div class="hint" style="color:#c62828;">' + info + '</div>' +
    '<div id="sumBlock" style="display:none;">' +
    '<input type="text" id="sum" class="sum-input" placeholder="Введите сумму">' +
    '<div class="error" id="errorNumber">Пожалуйста, укажите число, например, 2000<br>Все расчеты в таблице ведутся в рублях автоматически</div>' +
    '<div class="error" id="errorSpace">Уберите, пожалуйста, пробел</div>' +
    '<button class="save-btn" onclick="saveSum()">Сохранить</button>' +
    '</div>' +
    '<div id="buttonsBlock">' +
    '<button class="btn-yes" onclick="showInput()">Да</button>' +
    '<button class="btn-no" onclick="showSkip()">Нет, спасибо, укажу позже</button>' +
    '</div>';
}

function showInput() {
  document.getElementById('buttonsBlock').style.display = 'none';
  document.getElementById('sumBlock').style.display = 'block';
  document.getElementById('sum').focus();
}

function saveSum() {
  var val = document.getElementById('sum').value;
  var errNum = document.getElementById('errorNumber');
  var errSpc = document.getElementById('errorSpace');
  errNum.style.display = 'none';
  errSpc.style.display = 'none';
  if (val.indexOf(' ') !== -1) { errSpc.style.display = 'block'; return; }
  var trimmed = val.trim();
  if (trimmed === '') { errNum.style.display = 'block'; return; }
  var num = Number(trimmed);
  if (isNaN(num) || num < 0) { errNum.style.display = 'block'; return; }
  google.script.run
    .withSuccessHandler(function() { showDone(); })
    .withFailureHandler(function(err) { showDone(); })
    .saveStartSum(num);
}

function showSkip() {
  document.getElementById('content').innerHTML =
    '<div class="center">' +
    '<div class="icon">❤️</div>' +
    '<div style="font-size:15px;color:#333;line-height:1.5;margin-bottom:25px;">Вы всегда можете указать Начальную сумму позже в ячейке под текстом «Начальная сумма»</div>' +
    '<button class="save-btn" onclick="closeDialog()">Спасибо большое!</button>' +
    '</div>';
}

function showDone() {
  document.getElementById('content').innerHTML =
    '<div class="center">' +
    '<div class="icon">❤️</div>' +
    '<div style="font-size:15px;color:#333;line-height:1.5;margin-bottom:25px;">Спасибо большое за ожидание, Ваш бюджет готов!<br>Осталось заполнить категории Расходов и Доходов.</div>' +
    '<button class="save-btn" onclick="closeDialog()">Спасибо, заполню!</button>' +
    '</div>';
}

function closeDialog() {
  google.script.host.close();
}

showMonthStep();
</script>
</body>
</html>
